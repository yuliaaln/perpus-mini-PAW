    <h1>Manajemen Data Buku</h1>
    <form id="bookForm">
  <input type="hidden" id="id_buku" name="id_buku">
  <input type="text" id="judul" name="judul" placeholder="Judul Buku" required>
  <input type="text" id="penulis" name="penulis" placeholder="Penulis" required>
  <input type="text" id="penerbit" name="penerbit" placeholder="Penerbit" required>
  <input type="date" id="tahun" name="tahun" placeholder="Tahun Terbit" required>
  <button type="submit">Kirim</button>
</form>

  <thead>

      <th>No</th>
      <th>Judul</th>
